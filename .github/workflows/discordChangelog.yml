name: Post Changelog to Discord

# triggers when pushing a tag, or by hand from the actions tab
on:
  push:
    tags:
      - '**'
  workflow_dispatch:

jobs:
  discord:
    runs-on: ubuntu-latest
    steps:
        - uses: actions/checkout@v4
        - name: Generate package changelog
          run: python3 tools/generate_changelog_txt.py changelog.lua CHANGELOG_NEW_VERSION.txt
        - name: Post changelog to Discord
          env:
            DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          run: |
            python3 - <<'EOF'
            import json, os, re, urllib.request
            # discord markdown: version as title, sections as headers, the area in front of a change in bold
            lines = []
            for i, line in enumerate(open("CHANGELOG_NEW_VERSION.txt", encoding="utf-8").read().splitlines()):
                if i == 0:
                    line = "# GW2 UI " + line.strip()
                elif line.startswith("    - "):
                    line = "- " + re.sub(r"^(.{1,40}?): ", r"**\1:** ", line[6:], count=1)
                elif line.strip():
                    line = "## " + line.strip().capitalize()
                lines.append(line + "\n")
            chunks, chunk = [], ""
            for line in lines:
                if len(chunk) + len(line) > 2000:
                    chunks.append(chunk)
                    chunk = ""
                chunk += line
            chunks.append(chunk)
            for text in chunks:
                body = json.dumps({"content": text, "allowed_mentions": {"parse": []}}).encode()
                urllib.request.urlopen(urllib.request.Request(os.environ["DISCORD_WEBHOOK"], body, {"Content-Type": "application/json", "User-Agent": "GW2_UI release"}))
            EOF
