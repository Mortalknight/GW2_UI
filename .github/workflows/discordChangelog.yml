name: Post Changelog to Discord

# triggers when pushing a tag, or by hand from the actions tab
on:
  push:
    tags:
      - '**'
  workflow_dispatch:

jobs:
  discord:
    runs-on: ubuntu-latest
    steps:
        - uses: actions/checkout@v4
        - name: Generate package changelog
          run: python3 tools/generate_changelog_txt.py changelog.lua CHANGELOG_NEW_VERSION.txt
        - name: Post changelog to Discord
          env:
            DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          run: |
            python3 - <<'EOF'
            import datetime, json, os, re, urllib.request
            # an embed like the github bot: the version links to its release, sections as headers, the area in front of a change in bold
            source = open("CHANGELOG_NEW_VERSION.txt", encoding="utf-8").read().splitlines()
            version = source[0].strip()
            repo = os.environ["GITHUB_REPOSITORY"]
            lines = []
            for line in source[1:]:
                if line.startswith("    - "):
                    line = "- " + re.sub(r"^(.{1,40}?): ", r"**\1:** ", line[6:], count=1)
                elif line.strip():
                    line = "## " + line.strip().capitalize()
                lines.append(line + "\n")
            # an embed description holds 4096 characters
            chunks, chunk = [], ""
            for line in lines:
                if len(chunk) + len(line) > 4096:
                    chunks.append(chunk)
                    chunk = ""
                chunk += line
            chunks.append(chunk)
            embeds = [{"description": text.strip(), "color": 0x963232} for text in chunks]
            # the release is created after this post, its link is known already
            embeds[0].update(title="GW2 UI " + version, url=f"https://github.com/{repo}/releases/tag/{version}")
            embeds[-1].update(footer={"text": "GW2 UI"}, timestamp=datetime.datetime.now(datetime.timezone.utc).isoformat())
            for embed in embeds:
                body = json.dumps({"embeds": [embed], "allowed_mentions": {"parse": []}}).encode()
                urllib.request.urlopen(urllib.request.Request(os.environ["DISCORD_WEBHOOK"], body, {"Content-Type": "application/json", "User-Agent": "GW2_UI release"}))
            EOF
