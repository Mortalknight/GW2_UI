name: Alphas

# triggers when pushing onto develop
on:
  push:
    branches:
      - develop

env:
  # for github releases, this secret is automatically provided to the workflow
  GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
  CF_API_KEY: ${{ secrets.CF_API_KEY }}
  WAGO_PROJECT_ID: "Mj6jXpGR"

jobs:
  release: # "release" is a job, you can name it anything you want
    runs-on: ubuntu-latest
    steps:
        - uses: actions/checkout@v4
          with:
            fetch-depth: 0

        - name: Generate package changelog
          run: python3 tools/generate_changelog_txt.py changelog.lua CHANGELOG_NEW_VERSION.txt

        - name: Determine alpha version
          id: alpha
          shell: bash
          run: |
            version="$(sed -n '1{/^[[:space:]]*$/d;s/[[:space:]]//g;p;q;}' CHANGELOG_NEW_VERSION.txt)"
            if [[ -z "$version" ]]; then
              echo "Unable to determine alpha version from CHANGELOG_NEW_VERSION.txt" >&2
              exit 1
            fi

            short_sha="$(git rev-parse --short=7 HEAD)"
            alpha_version="${version}-${short_sha}"

            echo "alpha_version=${alpha_version}" >> "$GITHUB_OUTPUT"
            echo "Alpha version: ${alpha_version}"
            sed -i "s/@project-version@/${alpha_version}/g" GW2_UI.toc

        - name: Optimize PNG assets
          run: |
            echo "Installiere pngquant..."
            sudo apt-get update && sudo apt-get install -y pngquant

            echo "Komprimiere PNG-Bilder (das kann einen Moment dauern)..."
            # Sucht alle PNG-Dateien im Add-on und komprimiert sie direkt (überschreibt die Originale)
            # --skip-if-larger sorgt dafür, dass Dateien nicht versehentlich größer werden
            # --ext .png --force überschreibt die alten unkomprimierten Bilder
            find . -name "*.png" -exec pngquant --quality=65-80 --skip-if-larger --ext .png --force {} \; || true
            echo "Kompression abgeschlossen!"

        - uses: BigWigsMods/packager@master
          with:
            args: >-
              -n
              {package-name}-${{ steps.alpha.outputs.alpha_version }}{nolib}{classic}:${{ steps.alpha.outputs.alpha_version }}{classic}{nolib}

        - name: Upload Alpha to Wago
          env:
            WAGO_TOKEN: ${{ secrets.WAGO_API_TOKEN }}
          run: |
            # Sucht die vom Packager erstellte ZIP-Datei im .release-Ordner
            ZIP_FILE=$(ls .release/*.zip | head -n 1)

            if [ -z "$ZIP_FILE" ]; then
              echo "Keine ZIP-Datei im .release-Ordner gefunden!" >&2
              exit 1
            fi

            echo "Lade Datei hoch: $ZIP_FILE"

            # Offizieller Wago Addons API-Endpunkt
            curl -X POST "https://wago.io/${{ env.WAGO_PROJECT_ID }}/version" \
              -H "Authorization: Bearer $WAGO_TOKEN" \
              -F "file=@$ZIP_FILE" \
              -F "metadata={\"label\":\"${{ steps.alpha.outputs.alpha_version }}\",\"stability\":\"alpha\",\"changelog\":${{ steps.alpha.outputs.changelog_json }},\"gameStructure\":[\"retail\"]}"

